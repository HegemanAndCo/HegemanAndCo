<!DOCTYPE html><html><head><title>Katrina Souder's Renders</title><link rel="icon" type="image/png" href="https://rawcdn.githack.com/HegemanAndCo/HegemanAndCo/main/ASSETS/Hegeman_favicon.png"><link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&display=swap" rel="stylesheet"><style>body{font-family:'Libre Baskerville', serif;display:flex;justify-content:center;margin:0;padding-top:50px;background-color:#f5f5f5;text-align:center;}.container{max-width:500px;margin:0 auto;background-color:#ffffff;padding:30px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,0.1);}.button-container{display:flex;justify-content:center;margin-bottom:20px;flex-wrap:wrap;}.button-container button{margin:5px;padding:10px 20px;background-color:#333333;color:#ffffff;border:none;border-radius:5px;font-size:16px;cursor:pointer;transition:background-color 0.3s ease;}.button-container button:hover{background-color:#555555;}a.generated-link{display:inline-block;padding:8px 16px;background-color:#333333;border:1px solid #333333;border-radius:5px;margin:5px;cursor:pointer;transition:background-color 0.3s ease;text-decoration:none;color:#ffffff;}h1{color:#000000;font-size:30px;margin-bottom:20px;}h2{color:#333333;font-size:15px;margin-bottom:20px;}@media screen and (max-width: 767px){.button-container button{margin:5px;width:calc(100% - 10px);}}.star-row{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;margin:0;}.rp-star{width:28px;height:28px;cursor:pointer;flex:0 0 auto;transition:transform .12s ease;}.rp-star:hover{transform:scale(1.12)}.rp-star path{fill:none;stroke:#b0b0b0;stroke-width:1.6;transition:fill .15s,stroke .15s}.rp-star.on path{fill:#FFC61A;stroke:#E0A200}@media screen and (max-width:767px){.star-row .generated-button{width:auto;max-width:calc(100% - 46px)}}</style></head><body><div class="container"><h1>Katrina Souder's Renders</h1><h2>Each button will take you to the respective ring option</h2><div class="button-container"><div class="star-row"><button class="generated-button" onclick="window.open('https://hegemanandco.github.io/HegemanAndCo/Viewer/Viewer.html?m=https://rawcdn.githack.com/HegemanAndCo/HegemanAndCo/main/ASSETS/KatrinaPTmatteWB_blender.glb', '_blank')">Platinum Diamond Curved Wedding Band</button><svg class="rp-star" viewBox="0 0 24 24" aria-label="Mark as chosen"><path d="M12 2.6l2.95 5.98 6.6.96-4.77 4.65 1.13 6.57L12 17.6l-5.91 3.11 1.13-6.57L2.45 9.54l6.6-.96L12 2.6z"/></svg></div><div class="star-row"><button class="generated-button" onclick="window.open('https://hegemanandco.github.io/HegemanAndCo/Viewer/Viewer.html?m=https://rawcdn.githack.com/HegemanAndCo/HegemanAndCo/main/ASSETS/KatrinaFlatPTwn_blender.glb', '_blank')">Version 2 Flat Band</button><svg class="rp-star" viewBox="0 0 24 24" aria-label="Mark as chosen"><path d="M12 2.6l2.95 5.98 6.6.96-4.77 4.65 1.13 6.57L12 17.6l-5.91 3.11 1.13-6.57L2.45 9.54l6.6-.96L12 2.6z"/></svg></div></div></div><script>(function(){document.querySelectorAll('.rp-star').forEach(function(s,i){var k='rpstar:'+location.pathname+':'+i;try{if(localStorage.getItem(k)==='1')s.classList.add('on')}catch(e){}s.addEventListener('click',function(){var on=s.classList.toggle('on');try{if(on)localStorage.setItem(k,'1');else localStorage.removeItem(k)}catch(e){}})})})();</script></body></html>
