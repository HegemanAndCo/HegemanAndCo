<!DOCTYPE html><html><head><title>Marc & Sarah's Renders</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" type="image/png" href="https://rawcdn.githack.com/HegemanAndCo/HegemanAndCo/main/ASSETS/Hegeman_favicon.png"><link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&display=swap" rel="stylesheet"><style>:root{--bg:#f5f5f5;--card:#ffffff;--h1:#000000;--h2:#333333;--btn:#333333;--btn-hover:#555555;--btn-text:#ffffff;--shadow:rgba(0,0,0,0.1);--tg-border:#cccccc;}body.dark{--bg:#1a1a1a;--card:#242424;--h1:#f0f0f0;--h2:#aaaaaa;--btn:#6b6b6b;--btn-hover:#828282;--btn-text:#ffffff;--shadow:rgba(0,0,0,0.5);--tg-border:#444444;}body{font-family:'Libre Baskerville', serif;display:flex;justify-content:center;margin:0;padding-top:50px;background-color:var(--bg);text-align:center;transition:background-color 0.3s ease;}.container{max-width:500px;margin:0 auto;background-color:var(--card);padding:30px;border-radius:10px;box-shadow:0 0 10px var(--shadow);transition:background-color 0.3s ease,box-shadow 0.3s ease;}.button-container{display:flex;justify-content:center;margin-bottom:20px;flex-wrap:wrap;}.button-container button{margin:5px;padding:10px 20px;background-color:var(--btn);color:var(--btn-text);border:none;border-radius:5px;font-size:16px;cursor:pointer;transition:background-color 0.3s ease;}.button-container button:hover{background-color:var(--btn-hover);}a.generated-link{display:inline-block;padding:8px 16px;background-color:var(--btn);border:1px solid var(--btn);border-radius:5px;margin:5px;cursor:pointer;transition:background-color 0.3s ease;text-decoration:none;color:var(--btn-text);}h1{color:var(--h1);font-size:30px;margin-bottom:20px;}h2{color:var(--h2);font-size:15px;margin-bottom:20px;}.theme-toggle{position:fixed;top:14px;right:14px;width:34px;height:34px;padding:0;border:1px solid var(--tg-border);border-radius:50%;background-color:var(--card);color:var(--h1);font-size:16px;line-height:1;cursor:pointer;transition:background-color 0.3s ease,border-color 0.3s ease;}@media screen and (max-width: 767px){.button-container button{margin:5px;width:calc(100% - 10px);}}.star-row{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;margin:0;}.rp-star{width:28px;height:28px;flex:0 0 auto;cursor:pointer}.rp-star:hover path{stroke:#E0A200}.rp-star path{fill:none;stroke:#b0b0b0;stroke-width:1.6}.rp-star.on path{fill:#FFC61A;stroke:#E0A200}@media screen and (max-width:767px){.star-row .generated-button{width:auto;max-width:calc(100% - 46px)}}</style></head><body><button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">&#9790;</button><div class="container"><h1>Marc & Sarah's Renders</h1><h2>Each button will take you to the respective ring option</h2><div class="button-container"><div class="star-row"><button class="generated-button" onclick="window.open('https://hegemanandco.github.io/HegemanAndCo/Viewer/Viewer.html?m=https://rawcdn.githack.com/HegemanAndCo/HegemanAndCo/d56399f27dfb4db994d1067c533e690fb98a8c04/ASSETS/Marc_&_Sarah_v3_blender.glb', '_blank')">Version 3 Platinum non-symmetrical Cluster</button><svg class="rp-star" viewBox="0 0 24 24" aria-label="Chosen version"><path d="M12 2.6l2.95 5.98 6.6.96-4.77 4.65 1.13 6.57L12 17.6l-5.91 3.11 1.13-6.57L2.45 9.54l6.6-.96L12 2.6z"/></svg></div><div class="star-row"><button class="generated-button" onclick="window.open('https://hegemanandco.github.io/HegemanAndCo/Viewer/Viewer.html?m=https://rawcdn.githack.com/HegemanAndCo/HegemanAndCo/d56399f27dfb4db994d1067c533e690fb98a8c04/ASSETS/Marc_&_Sarah_v4_blender.glb', '_blank')">Version 4 Platinum non-symmetrical Cluster with European Band</button><svg class="rp-star" viewBox="0 0 24 24" aria-label="Chosen version"><path d="M12 2.6l2.95 5.98 6.6.96-4.77 4.65 1.13 6.57L12 17.6l-5.91 3.11 1.13-6.57L2.45 9.54l6.6-.96L12 2.6z"/></svg></div><div class="star-row"><button class="generated-button" onclick="window.open('https://hegemanandco.github.io/HegemanAndCo/Viewer/Viewer.html?m=https://rawcdn.githack.com/HegemanAndCo/HegemanAndCo/main/ASSETS/MarcPTcurveeternity.glb', '_blank')">Platinum Curved Eternity Wedding Band</button><svg class="rp-star" viewBox="0 0 24 24" aria-label="Chosen version"><path d="M12 2.6l2.95 5.98 6.6.96-4.77 4.65 1.13 6.57L12 17.6l-5.91 3.11 1.13-6.57L2.45 9.54l6.6-.96L12 2.6z"/></svg></div><div class="star-row"><button class="generated-button" onclick="window.open('https://hegemanandco.github.io/HegemanAndCo/Viewer/Viewer.html?m=https://rawcdn.githack.com/HegemanAndCo/HegemanAndCo/main/ASSETS/MarcPT7stone.glb', '_blank')">Platinum Curved 7 Stone Wedding Band</button><svg class="rp-star" viewBox="0 0 24 24" aria-label="Chosen version"><path d="M12 2.6l2.95 5.98 6.6.96-4.77 4.65 1.13 6.57L12 17.6l-5.91 3.11 1.13-6.57L2.45 9.54l6.6-.96L12 2.6z"/></svg></div><div class="star-row"><button class="generated-button" onclick="window.open('https://hegemanandco.github.io/HegemanAndCo/Viewer/Viewer.html?m=https://rawcdn.githack.com/HegemanAndCo/HegemanAndCo/main/ASSETS/MarcPT9stone.glb', '_blank')">Platinum Curved 9 Stone Wedding Band</button><svg class="rp-star" viewBox="0 0 24 24" aria-label="Chosen version"><path d="M12 2.6l2.95 5.98 6.6.96-4.77 4.65 1.13 6.57L12 17.6l-5.91 3.11 1.13-6.57L2.45 9.54l6.6-.96L12 2.6z"/></svg></div></div></div><script>var toggleBtn=document.getElementById('themeToggle');function applyTheme(dark){document.body.classList.toggle('dark',dark);toggleBtn.innerHTML=dark?'&#9728;':'&#9790;';}function isNightTime(){var h=new Date().getHours();return h>=20||h<8;}var urlTheme=null;try{urlTheme=new URLSearchParams(window.location.search).get('theme');}catch(e){}if(urlTheme==='dark'||urlTheme==='light'){applyTheme(urlTheme==='dark');try{localStorage.setItem('hegeman-theme',urlTheme);}catch(e){}}else{var savedTheme=null;try{savedTheme=localStorage.getItem('hegeman-theme');}catch(e){}if(savedTheme==='dark'||savedTheme==='light'){applyTheme(savedTheme==='dark');}else{applyTheme(isNightTime());}}toggleBtn.addEventListener('click',function(){var dark=!document.body.classList.contains('dark');applyTheme(dark);try{localStorage.setItem('hegeman-theme',dark?'dark':'light');}catch(e){}});</script><script>
(function(){
  var RCD=/RCDViewer\.html/.test(document.documentElement.innerHTML);var ENDPOINT='https://formsubmit.co/ajax/'+(RCD?'toolroom@robertcorio.com':'mcorio@robertcorio.com');
  var slug=(location.pathname.split('/').pop()||'page');
  var KEY='hegeman-choices-'+slug;
  function customer(){return (document.title||'').replace(/'s Renders$/,'').trim()||'Customer';}
  function starLabel(s){var b=s.parentNode&&s.parentNode.querySelector('.generated-button');return b?b.textContent.trim():'';}
  function stars(){return [].slice.call(document.querySelectorAll('.rp-star'));}
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function save(a){try{localStorage.setItem(KEY,JSON.stringify(a));}catch(e){}}
  var toast;
  function showToast(msg,ok){
    if(!toast){toast=document.createElement('div');
      toast.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2c2c2c;color:#fff;padding:11px 20px;border-radius:22px;font-size:14px;font-family:inherit;box-shadow:0 3px 12px rgba(0,0,0,.35);opacity:0;transition:opacity .3s ease;pointer-events:none;z-index:99999;max-width:90%;text-align:center;';
      document.body.appendChild(toast);}
    toast.textContent=msg;toast.style.background=ok?'#2c2c2c':'#8a1c1c';toast.style.opacity='1';
    clearTimeout(toast._t);toast._t=setTimeout(function(){toast.style.opacity='0';},3500);
  }
  function notify(label){
    showToast('Sending your choice…',true);
    var data={name:customer(),version:label,page:location.href,chosen_at:new Date().toLocaleString(),
      _subject:'Render pick — '+customer()+': '+label,_captcha:'false',_template:'table'};
    if(RCD)data._cc='rcorio@robertcorio.com';fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(data)})
      .then(function(r){return r.json().catch(function(){return{};});})
      .then(function(){showToast('✓ Choice sent — thank you!',true);})
      .catch(function(){showToast('Couldn’t send — please contact us directly.',false);});
  }
  var chosen=load();
  stars().forEach(function(s){if(chosen.indexOf(starLabel(s))>-1)s.classList.add('on');});
  stars().forEach(function(s){
    s.style.cursor='pointer';s.setAttribute('role','button');s.setAttribute('tabindex','0');s.setAttribute('aria-label','Choose this version');
    function toggle(){
      var lbl=starLabel(s);
      var nowOn=!s.classList.contains('on');
      s.classList.toggle('on',nowOn);
      var arr=load();var i=arr.indexOf(lbl);
      if(nowOn){if(i<0)arr.push(lbl);save(arr);notify(lbl);}
      else{if(i>-1)arr.splice(i,1);save(arr);showToast('Selection cleared',true);}
    }
    s.addEventListener('click',toggle);
    s.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
  });
})();
</script></body></html>
