<!DOCTYPE html><html><head><title>Matty Corio's Renders</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" type="image/png" href="https://rawcdn.githack.com/HegemanAndCo/HegemanAndCo/main/ASSETS/Hegeman_favicon.png"><link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&display=swap" rel="stylesheet"><style>:root{--bg:#f5f5f5;--card:#ffffff;--h1:#000000;--h2:#333333;--btn:#333333;--btn-hover:#555555;--btn-text:#ffffff;--shadow:rgba(0,0,0,0.1);--tg-border:#cccccc;}body.dark{--bg:#1a1a1a;--card:#242424;--h1:#f0f0f0;--h2:#aaaaaa;--btn:#6b6b6b;--btn-hover:#828282;--btn-text:#ffffff;--shadow:rgba(0,0,0,0.5);--tg-border:#444444;}body{font-family:'Libre Baskerville', serif;display:flex;justify-content:center;margin:0;padding-top:50px;background-color:var(--bg);text-align:center;transition:background-color 0.3s ease;}.container{max-width:500px;margin:0 auto;background-color:var(--card);padding:30px;border-radius:10px;box-shadow:0 0 10px var(--shadow);transition:background-color 0.3s ease,box-shadow 0.3s ease;}.button-container{display:flex;justify-content:center;margin-bottom:20px;flex-wrap:wrap;}.button-container button{margin:5px;padding:10px 20px;background-color:var(--btn);color:var(--btn-text);border:none;border-radius:5px;font-size:16px;cursor:pointer;transition:background-color 0.3s ease;}.button-container button:hover{background-color:var(--btn-hover);}a.generated-link{display:inline-block;padding:8px 16px;background-color:var(--btn);border:1px solid var(--btn);border-radius:5px;margin:5px;cursor:pointer;transition:background-color 0.3s ease;text-decoration:none;color:var(--btn-text);}h1{color:var(--h1);font-size:30px;margin-bottom:20px;}h2{color:var(--h2);font-size:15px;margin-bottom:20px;}.theme-toggle{position:fixed;top:14px;right:14px;width:34px;height:34px;padding:0;border:1px solid var(--tg-border);border-radius:50%;background-color:var(--card);color:var(--h1);font-size:16px;line-height:1;cursor:pointer;transition:background-color 0.3s ease,border-color 0.3s ease;}@media screen and (max-width: 767px){.button-container button{margin:5px;width:calc(100% - 10px);}}</style></head><body><button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">&#9790;</button><div class="container"><h1>Matty Corio's Renders</h1><h2>Each button will take you to the respective ring option</h2><div class="button-container"><button class="generated-button" onclick="window.open('https://hegemanandco.github.io/HegemanAndCo/Viewer/Viewer.html?m=https://rawcdn.githack.com/HegemanAndCo/HegemanAndCo/main/ASSETS/MattYGorbitring_blender.glb', '_blank')">Yellow Gold Orbit Ring</button><button class="generated-button" onclick="window.open('https://hegemanandco.github.io/HegemanAndCo/Viewer/Viewer.html?m=https://rawcdn.githack.com/HegemanAndCo/HegemanAndCo/main/ASSETS/MattRadiant3stone_blender.glb', '_blank')">Platinum Radiant Diamond 3 Stone</button></div></div><script>var toggleBtn=document.getElementById('themeToggle');function applyTheme(dark){document.body.classList.toggle('dark',dark);toggleBtn.innerHTML=dark?'&#9728;':'&#9790;';}function isNightTime(){var h=new Date().getHours();return h>=20||h<8;}var savedTheme=null;try{savedTheme=localStorage.getItem('hegeman-theme');}catch(e){}if(savedTheme==='dark'||savedTheme==='light'){applyTheme(savedTheme==='dark');}else{applyTheme(isNightTime());}toggleBtn.addEventListener('click',function(){var dark=!document.body.classList.contains('dark');applyTheme(dark);try{localStorage.setItem('hegeman-theme',dark?'dark':'light');}catch(e){}});</script></body></html>
